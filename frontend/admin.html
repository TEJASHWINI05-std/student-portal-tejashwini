<div class="container">
  <h2>Admin Panel</h2>
  <div id="data"></div>
</div>

<script>
async function loadData() {
  const res = await fetch("http://localhost:5000/api/messages");
  const data = await res.json();

  let output = "";
  data.forEach(item => {
    output += `<p>${item.name} - ${item.email} - ${item.message}</p>`;
  });

  document.getElementById("data").innerHTML = output;
}

loadData();
</script>
